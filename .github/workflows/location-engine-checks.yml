name: Location engine checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/never-fail-location-engine]

permissions:
  contents: read

concurrency:
  group: location-engine-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-public-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm install --no-audit --no-fund
      - name: Location ranking unit tests
        run: npm run test:location
      - name: TypeScript type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
